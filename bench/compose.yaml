# Banc de test local kafkabeat : deux clusters Kafka KRaft mono-nœud (3.9 et 4.4),
# deux piles Elasticsearch + Kibana (8.19 et 9.5) sans sécurité, Metricbeat
# (module kafka) en référence.
# Démarrage : make bench-up (docker compose -f bench/compose.yaml up -d --wait).
# Arrêt :     make bench-down (down -v).
#
# Rien n'est authentifié : tous les ports sont publiés sur 127.0.0.1 seulement.
# Ports hôte : Kafka 3.9 -> localhost:19092, Kafka 4.4 -> localhost:19094,
#              Jolokia 3.9 -> localhost:8778, Jolokia 4.4 -> localhost:8779,
#              Elasticsearch 8.19 -> localhost:9200, Kibana 8.19 -> localhost:5601,
#              Elasticsearch 9.5 -> localhost:9201, Kibana 9.5 -> localhost:5602.
# Depuis les conteneurs : kafka39:9092, kafka44:9092, elasticsearch:9200, elasticsearch9:9200.
# Prérequis : Docker Engine 25 et Compose 2.20 au moins (start_interval des healthchecks).

x-kafka-common: &kafka-common
  # Les variables KAFKA_* sont converties en propriétés server.properties par le
  # script de l'image (KAFKA_HEAP_OPTS est transmise telle quelle à la JVM).
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_NUM_PARTITIONS: "1"
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  # rétention appliquée toutes les 5 s au lieu de 5 min (critère 14 : log start qui rattrape un consumer)
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "5000"

x-kafka-healthcheck: &kafka-healthcheck
  # KAFKA_OPTS (agent Jolokia) vaut pour toutes les JVM du conteneur : vidé ici,
  # sinon l'outil tenterait d'ouvrir le port Jolokia du broker
  test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
  interval: 30s
  timeout: 15s
  retries: 5
  start_period: 90s
  start_interval: 3s

services:
  kafka39:
    image: apache/kafka:3.9.2
    container_name: kafka39
    hostname: kafka39
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:8778:8778"
    environment:
      <<: *kafka-common
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka39:9092,EXTERNAL://localhost:19092
      # agent Jolokia (metricset broker) : un port par cluster, les deux brokers s'annonçant localhost ;
      # 1.x ici, 2.x sur kafka44 (les deux générations répondent différemment à un MBean absent)
      KAFKA_OPTS: -javaagent:/opt/jolokia/agent.jar=host=0.0.0.0,port=8778
    volumes:
      - ./jolokia/jolokia-agent-1.jar:/opt/jolokia/agent.jar:ro
    healthcheck: *kafka-healthcheck

  kafka44:
    image: apache/kafka:4.4.0
    container_name: kafka44
    hostname: kafka44
    ports:
      - "127.0.0.1:19094:19094"
      - "127.0.0.1:8779:8779"
    environment:
      <<: *kafka-common
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka44:9092,EXTERNAL://localhost:19094
      KAFKA_OPTS: -javaagent:/opt/jolokia/agent.jar=host=0.0.0.0,port=8779
    volumes:
      - ./jolokia/jolokia-agent.jar:/opt/jolokia/agent.jar:ro
    healthcheck: *kafka-healthcheck

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    container_name: elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.name: bench
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 3s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    container_name: kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
      # clé permanente indispensable aux règles d'alerte (objets chiffrés) ; valeur de banc
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: kafkabeat-bench-encryption-key-0123456789
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
      start_interval: 5s

  # Couple 9.x : import et rendu des dashboards exportés depuis 8.19 (critère 8).
  elasticsearch9:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: elasticsearch9
    ports:
      - "127.0.0.1:9201:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.name: bench9
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 3s

  kibana9:
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: kibana9
    ports:
      - "127.0.0.1:5602:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch9:9200
      TELEMETRY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: kafkabeat-bench-encryption-key-0123456789
    depends_on:
      elasticsearch9:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
      start_interval: 5s

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.19.23
    container_name: metricbeat
    # --strict.perms=false : selon l'hôte (Windows, WSL), le fichier monté est inscriptible
    # par tous, ce que Metricbeat refuse par défaut.
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka39:
        condition: service_healthy
      kafka44:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "metricbeat", "test", "output", "--strict.perms=false"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
      start_interval: 5s
